[package]
authors = ["Christopher Sardegna <imessage@reagentx.net>"]
categories = ["command-line-utilities"]
description = "Export iMessage data and run iMessage diagnostics"
edition = "2024"
exclude = [".github", "docs", "build.sh"]
license = "GPL-3.0-or-later"
name = "imessage-exporter"
repository = "https://github.com/auracarehq/auracle-imessage-exporter"
version = "1.0.1"

[[bin]]
name = "auracle-imessage-exporter"
path = "src/auracle_main.rs"

[dependencies]
askama = "=0.16.0"
clap = { version = "=4.6.1", features = ["cargo", "derive"] }
fdlimit = "=0.3.0"
fs2 = "=0.4.3"
imessage-database = { path = "../imessage-database" }
rpassword = "=7.5.3"
rusqlite = { version = "=0.40.0", features = ["blob", "bundled"] }
crabapple = { version = "=0.4.7" }
base64 = "=0.22.1"
chrono = { version = "=0.4.44", default-features = false, features = ["std"] }
plist = "=1.9.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"

[dev-dependencies]
jsonschema = { version = "=0.45.0", default-features = false }
tempfile = "=3.27.0"
